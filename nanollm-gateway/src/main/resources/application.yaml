spring:
  application:
    name: nanollm-gateway
  gateway:
    cod

server:
  port: 28080

logging:
  level:
    org.springframework.cloud: DEBUG
    ChatMessage: DEBUG

llm:
  provider:
    dashscope:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      alias:
        kimi-k2:
          - kimi-k2.5
        qwen3.6:
          - qwen3.6-plus-2026-04-02
        xiaomi:
          - tongyi-xiaomi-analysis-pro
          - tongyi-xiaomi-analysis-flash
        qwen3.5:
          - qwen3.5-122b-a10b
          - qwen3.5-flash
          - qwen3.5-plus-2026-02-15
          - qwen3.5-flash-2026-02-23
          - qwen3.5-397b-a17b
        glm-5:
          - glm-5
          - glm-5.1
        MiniMax:
          - MiniMax-M2.5
          - MiniMax-M2.1
        free:
          - qwen3.7-max
          - qwen3.7-max-preview
          - qwen3.7-max-2026-05-17
          - qwen3.7-plus-2026-05-26
          - qwen3.7-plus
          - qwen3.7-max-2026-06-08
          - qwen3.7-flash
          - qwen3.7-flash-2026-07-15
          - qwen3.8-2.4t-a95b
          - qwen3.8-max
      apikey:
        - ${DASHSCOPE_API_KEY}
    xiaomimimo:
      base-url: https://api.xiaomimimo.com/v1
      apikey:
        - ${MIMO_API_KEY}
    deepseek:
      base-url: https://api.deepseek.ai/v1
      apikey:
        - ${DEEPSEEK_API_KEY}